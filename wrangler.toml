name = "tml-tracking"
compatibility_date = "2024-09-01"

# Cloudflare KV 命名空间绑定
# 部署前需要在 Cloudflare Dashboard 创建 KV 命名空间，并把 ID 填到下面
[[kv_namespaces]]
binding = "TRACKING_KV"
id = "YOUR_KV_NAMESPACE_ID_HERE"

# 定时任务：每天 UTC 20:00 (泰国时间 03:00 次日) 触发
# 注意：Cloudflare Cron Triggers 用 UTC 时间
[triggers]
crons = ["0 20 * * *"]
